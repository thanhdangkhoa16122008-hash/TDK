# Build app Android "Mây AI" → file APK đính kèm trong mục Releases của repo.
name: Android APK
on:
  push:
    paths: ['android/**', 'html/kit/chatbot.js', 'html/kit/chatbot-data.js', 'mini-gpt/mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Tạo Mây mini
        run: node android/build-assets.mjs
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MayAI.apk
          ls -la MayAI.apk
      - uses: actions/upload-artifact@v4
        with: { name: MayAI-apk, path: android/MayAI.apk }
      - name: Đăng lên Releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "android-v${{ github.run_number }}" android/MayAI.apk \
            --target "${{ github.sha }}" --title "Mây AI Android #${{ github.run_number }}" \
            --notes "Mở trang này trên điện thoại, tải MayAI.apk và cài (cho phép cài ứng dụng không rõ nguồn khi được hỏi). Cần Android 10+."
