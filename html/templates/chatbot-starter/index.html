<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chatbot Mây</title>
<style>
  :root { --bg: #eef1f7; --card: #fff; --me: #4f6bed; --meText: #fff; --bot: #fff; --text: #1f2430; --muted: #7a8194; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161c; --card: #1d2029; --bot: #262a35; --text: #e8eaf0; --muted: #8a90a2; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  #app { max-width: 720px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
  header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-weight: 800; }
  header .dot { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #7ab8ff, #4f6bed); display: grid; place-items: center; color: #fff; }
  header small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 9px 13px; border-radius: 16px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; box-shadow: 0 1px 2px #0001; }
  .me { align-self: flex-end; background: var(--me); color: var(--meText); border-bottom-right-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: -4px; align-self: flex-start; }
  #chips { display: flex; gap: 6px; padding: 4px 16px; overflow-x: auto; scrollbar-width: none; }
  #chips button { flex: none; border: 1px solid #0002; background: var(--card); color: var(--text); border-radius: 14px; padding: 6px 11px; font: 13px system-ui; }
  form { display: flex; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  input { flex: 1; min-width: 0; border: 1px solid #0002; background: var(--card); color: var(--text); border-radius: 22px; padding: 11px 16px; font-size: 16px; outline: none; }
  form button { border: 0; border-radius: 22px; padding: 0 18px; background: var(--me); color: #fff; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div id="app">
  <header><div class="dot">M</div><div>Mây<small id="status">đang học…</small></div></header>
  <div id="log"></div>
  <div id="chips"></div>
  <form id="f"><input id="q" placeholder="Nhắn cho Mây…" autocomplete="off" autofocus><button>Gửi</button></form>
</div>
<script type="module">
import { createChatbot } from '../../kit/chatbot.js';
import { INTENTS } from '../../kit/chatbot-data.js';

const bot = createChatbot({ intents: INTENTS, botName: 'Mây' });
const t0 = performance.now();
const info = bot.train();
document.getElementById('status').textContent = `${info.intents} chủ đề · học xong trong ${Math.round(performance.now() - t0)} ms · chạy offline`;

// Nhớ tên người dùng giữa các lần mở trang
try { bot.ctx.name = localStorage.getItem('tdk-chatbot-name') || null; } catch {}

const log = document.getElementById('log');
const showDebug = new URLSearchParams(location.search).has('debug');
function add(text, who, meta) {
  const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text; log.append(d);
  if (meta && showDebug) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; log.append(m); }
  log.scrollTop = log.scrollHeight;
}
function send(text) {
  if (!text.trim()) return;
  add(text, 'me');
  const r = bot.reply(text);
  setTimeout(() => add(r.text, 'bot', `${r.intent} · ${Math.round(r.confidence * 100)}%`), 250);
  try { if (bot.ctx.name) localStorage.setItem('tdk-chatbot-name', bot.ctx.name); } catch {}
}

document.getElementById('f').onsubmit = (e) => { e.preventDefault(); const q = document.getElementById('q'); send(q.value); q.value = ''; };
const chips = document.getElementById('chips');
['Xin chào', 'Tên tôi là Khoa', 'Bạn làm được gì?', 'Mấy giờ rồi?', '12 nhân 7', 'Kể chuyện cười', 'Mình buồn quá'].forEach((t) => {
  const b = document.createElement('button'); b.textContent = t; b.onclick = () => send(t); chips.append(b);
});
add(bot.ctx.name ? `Chào ${bot.ctx.name}, lại gặp nhau rồi!` : 'Xin chào! Mình là Mây. Bạn tên gì?', 'bot');
window.bot = bot; // để thử trong Console: bot.unknown, bot.predict('...')
</script>
</body>
</html>
